<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Botaniva</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            font-family: Arial;
            margin:0;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:400px;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:#5d6d4e;
        }

        .tabs{
            display:flex;
            margin-bottom:20px;
        }

        .tabs button{
            flex:1;
            padding:10px;
            border:none;
            cursor:pointer;
            background:#e8efe2;
            color:#5d6d4e;
        }

        .tabs button.active{
            background:#5d6d4e;
            color:white;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button.submit{
            width:100%;
            padding:10px;
            background:#5d6d4e;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            margin-top:10px;
        }

        button.submit:hover{
            background:#4a5a3e;
        }

        .form{
            display:none;
        }

        .form.active{
            display:block;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Botaniva</h2>

    <div class="tabs">
        <button onclick="showForm('login')" class="active" id="loginBtn">Giriş Yap</button>
        <button onclick="showForm('register')" id="registerBtn">Kayıt Ol</button>
    </div>

    <!-- GİRİŞ BÖLÜMÜNDEKİ BUTONU ŞU ŞEKİLDE GÜNCELLE -->
<div id="login" class="form active">
    <input type="email" placeholder="E-posta">
    <input type="password" placeholder="Şifre">
    <button class="submit" onclick="loginFunc()">Giriş Yap</button>
</div>

    <!-- KAYIT BÖLÜMÜ -->
<div id="register" class="form">
    <input type="text" id="regName" placeholder="Ad Soyad">
    <input type="email" id="regEmail" placeholder="E-posta">
    <input type="password" id="regPass" placeholder="Şifre">
    <button class="submit" onclick="registerFunc()">Kayıt Ol</button>
</div>

</div>



<!-- SweetAlert2 kütüphanesini dahil ediyoruz -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // Giriş yap butonuna basıldığında çalışan fonksiyon
    function loginFunc() {
        Swal.fire({
            title: 'Hoş Geldiniz!',
            text: 'Botaniva dünyasına başarıyla giriş yaptınız. Yönlendiriliyorsunuz...',
            icon: 'success',
            iconColor: '#5d6d4e',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#fefefe',
            color: '#5d6d4e',
            willClose: () => {
                // Ana sayfaya yönlendirir. Eğer dosya 'pages' içindeyse '../index.html' yapmalısın.
                window.location.href = "../index.html"; 
            }
        });
    }

    // Sekmeler arası geçişi sağlayan fonksiyon
    function showForm(type){
        document.getElementById("login").classList.remove("active");
        document.getElementById("register").classList.remove("active");
        document.getElementById(type).classList.add("active");

        document.getElementById("loginBtn").classList.remove("active");
        document.getElementById("registerBtn").classList.remove("active");

        if(type === "login"){
            document.getElementById("loginBtn").classList.add("active");
        } else {
            document.getElementById("registerBtn").classList.add("active");
        }
    }
    function registerFunc() {
    // 1. Şık mesajı göster (SweetAlert kütüphanesini eklediysen onu kullanır)
    Swal.fire({
        
        text: 'Kaydınız başarıyla oluşturuldu.',
        icon: 'success',
        confirmButtonColor: '#5d6d4e',
        confirmButtonText: 'Tamam'
    });

    // 2. Sayfadaki (formdaki) yazıları temizle
    document.getElementById("regName").value = "";
    document.getElementById("regEmail").value = "";
    document.getElementById("regPass").value = "";
    
   
}
</script>

</body>
</html>
